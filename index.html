<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="UOP6PgDCRfwyJbvqHqJDbj">
<head data-page-node-id="cskzUPwqz40YQB4g5sNbT7">
  <meta charset="UTF-8" data-page-node-id="jx3lSmzddc9kHDw6zbnoYa" />
  <title>WeRead PC</title>
  <style>
    :root {
      --bar-bg: #fbfbfc;
      --bar-border: #e6e7eb;
      --text: #2c2f36;
      --text-dim: #8a8f9a;
      --accent: #2f7de1;
      --accent-soft: #e8f1fd;
      --hover: #f0f1f4;
      --radius: 8px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
      color: var(--text);
      background: var(--bar-bg);
    }

    #bar {
      height: 52px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 16px;
      background: var(--bar-bg);
      border-bottom: 1px solid var(--bar-border);
      -webkit-user-select: none;
      user-select: none;
    }
    .group { display: flex; align-items: center; gap: 8px; }
    .sep { width: 1px; height: 22px; background: var(--bar-border); }
    .hint { font-size: 12px; color: var(--text-dim); }
    .spacer { margin-left: auto; }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      height: 32px;
      padding: 0 12px;
      border: 1px solid var(--bar-border);
      border-radius: var(--radius);
      background: #fff;
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      transition: background .12s, border-color .12s, color .12s, box-shadow .12s;
      box-shadow: 0 1px 1px rgba(16, 18, 24, .04);
    }
    button:hover { background: var(--hover); border-color: #d3d6dd; }
    button:active { background: #e8eaee; box-shadow: none; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 1px 2px rgba(47, 125, 225, .25);
    }
    button.primary:hover { background: #2a6fc8; border-color: #2a6fc8; }
    button.primary:active { background: #2560af; }
    button[disabled] { opacity: .45; cursor: default; }

    /* 分段控件：A−  [label]  A＋ */
    .segmented {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--bar-border);
      border-radius: var(--radius);
      background: #fff;
      overflow: hidden;
      box-shadow: 0 1px 1px rgba(16, 18, 24, .04);
    }
    .segmented button {
      height: 30px;
      width: 34px;
      padding: 0;
      border: none;
      border-radius: 0;
      box-shadow: none;
      background: transparent;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }
    .segmented button:hover { background: var(--hover); }
    .segmented .value {
      min-width: 76px;
      height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: var(--text-dim);
      border-left: 1px solid var(--bar-border);
      border-right: 1px solid var(--bar-border);
      background: #fafbfc;
      font-variant-numeric: tabular-nums;
    }

    input#interval {
      width: 56px;
      height: 32px;
      padding: 0 8px;
      border: 1px solid var(--bar-border);
      border-radius: var(--radius);
      font-size: 13px;
      font-family: inherit;
      text-align: center;
      color: var(--text);
      background: #fff;
    }
    input#interval:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }

    #status { font-size: 12px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
    #status.on { color: #1f9254; }

    #wrap { display: flex; flex-direction: column; height: calc(100% - 52px); }
    webview { flex: 1; width: 100%; }
  </style>
</head>

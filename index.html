<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="UOP6PgDCRfwyJbvqHqJDbj">
<head data-page-node-id="cskzUPwqz40YQB4g5sNbT7">
  <meta charset="UTF-8" data-page-node-id="jx3lSmzddc9kHDw6zbnoYa" />
  <title>WeRead PC</title>
  <style>
    :root {
      --bar-bg: #fbfbfc;
      --bar-border: #e6e7eb;
      --text: #2c2f36;
      --text-dim: #8a8f9a;
      --accent: #2f7de1;
      --accent-soft: #e8f1fd;
      --hover: #f0f1f4;
      --radius: 8px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
      color: var(--text);
      background: var(--bar-bg);
    }

    #bar {
      height: 52px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 16px;
      background: var(--bar-bg);
      border-bottom: 1px solid var(--bar-border);
      -webkit-user-select: none;
      user-select: none;
    }
    .group { display: flex; align-items: center; gap: 8px; }
    .sep { width: 1px; height: 22px; background: var(--bar-border); }
    .hint { font-size: 12px; color: var(--text-dim); }
    .spacer { margin-left: auto; }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      height: 32px;
      padding: 0 12px;
      border: 1px solid var(--bar-border);
      border-radius: var(--radius);
      background: #fff;
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      transition: background .12s, border-color .12s, color .12s, box-shadow .12s;
      box-shadow: 0 1px 1px rgba(16, 18, 24, .04);
    }
    button:hover { background: var(--hover); border-color: #d3d6dd; }
    button:active { background: #e8eaee; box-shadow: none; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 1px 2px rgba(47, 125, 225, .25);
    }
    button.primary:hover { background: #2a6fc8; border-color: #2a6fc8; }
    button.primary:active { background: #2560af; }
    button[disabled] { opacity: .45; cursor: default; }

    /* 分段控件：A−  [label]  A＋ */
    .segmented {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--bar-border);
      border-radius: var(--radius);
      background: #fff;
      overflow: hidden;
      box-shadow: 0 1px 1px rgba(16, 18, 24, .04);
    }
    .segmented button {
      height: 30px;
      width: 34px;
      padding: 0;
      border: none;
      border-radius: 0;
      box-shadow: none;
      background: transparent;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }
    .segmented button:hover { background: var(--hover); }
    .segmented .value {
      min-width: 76px;
      height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: var(--text-dim);
      border-left: 1px solid var(--bar-border);
      border-right: 1px solid var(--bar-border);
      background: #fafbfc;
      font-variant-numeric: tabular-nums;
    }

    input#interval {
      width: 56px;
      height: 32px;
      padding: 0 8px;
      border: 1px solid var(--bar-border);
      border-radius: var(--radius);
      font-size: 13px;
      font-family: inherit;
      text-align: center;
      color: var(--text);
      background: #fff;
    }
    input#interval:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }

    #status { font-size: 12px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
    #status.on { color: #1f9254; }

    #wrap { display: flex; flex-direction: column; height: calc(100% - 52px); }
    webview { flex: 1; width: 100%; }

    /* ===== 原生书架覆盖层（方向2 清爽网格）===== */
    #shelf {
      position: fixed; inset: 0; z-index: 10;
      display: none; flex-direction: column;
      background: #fafbfc; color: var(--text);
    }
    #shelf.show { display: flex; }

    /* ===== 全屏 loading 覆盖层（不透明，盖住 webview；翻书动画）===== */
    #loading {
      position: fixed; inset: 0; z-index: 20;
      display: none; flex-direction: column; align-items: center; justify-content: center;
      gap: 22px; background: #fafbfc;
    }
    #loading.show { display: flex; }
    .book { position: relative; width: 92px; height: 62px; perspective: 600px; }
    .book .half {
      position: absolute; top: 0; width: 46px; height: 62px;
      background: linear-gradient(180deg, #eef1f6, #e6eaf1); border: 1px solid #dfe4ec;
    }
    .book .half.l { left: 0; border-radius: 6px 2px 2px 6px; }
    .book .half.r { right: 0; border-radius: 2px 6px 6px 2px; }
    .book .spine {
      position: absolute; left: 45px; top: 2px; width: 2px; height: 58px;
      background: #d5dbe5; border-radius: 1px;
    }
    .book .flip {
      position: absolute; top: 0; left: 46px; width: 46px; height: 62px;
      transform-origin: left center;
      background: linear-gradient(90deg, #ffffff, #f3f6fa);
      border: 1px solid #e2e7ef; border-radius: 2px 6px 6px 2px;
      box-shadow: 0 2px 8px rgba(16,18,24,.10);
      animation: bookflip 1.6s cubic-bezier(.45,.05,.55,.95) infinite;
    }
    @keyframes bookflip {
      0%   { transform: rotateY(0deg); }
      50%  { transform: rotateY(-180deg); }
      100% { transform: rotateY(-360deg); }
    }
    .loading-text {
      font-size: 13px; color: var(--text-dim); letter-spacing: .5px;
      animation: loadpulse 1.6s ease-in-out infinite;
    }
    @keyframes loadpulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
    .shelf-head {
      height: 52px; flex: none; display: flex; align-items: center; gap: 8px;
      padding: 0 16px; background: var(--bar-bg); border-bottom: 1px solid var(--bar-border);
      -webkit-user-select: none; user-select: none;
    }
    .shelf-title { font-size: 15px; font-weight: 600; margin-right: 6px; }
    .pill { font-size: 12px; padding: 3px 10px; border-radius: 12px; font-variant-numeric: tabular-nums; }
    .pill-read { background: #e8f1fd; color: #2f7de1; }
    .pill-done { background: #eafaf1; color: #1f9254; }
    .pill-time { background: #f3f0ff; color: #7a5af5; }
    .shelf-refresh { margin-left: 8px; height: 30px; padding: 0 12px; }
    .shelf-body { flex: 1; overflow: hidden; display: flex; flex-direction: column; padding: 16px 20px 0; }
    .shelf-subhead { font-size: 13px; color: var(--text-dim); margin: 6px 0 10px; }
    .continue-row { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 8px; flex: none; }
    .continue-row .book-card { width: 110px; flex: none; }

    .book-card { cursor: pointer; }
    .book-card .cover {
      position: relative; aspect-ratio: 3 / 4; border-radius: 8px; overflow: hidden;
      background: linear-gradient(135deg, #eef1f5, #dfe4ea);
      border: 1px solid #eef0f3; box-shadow: 0 1px 3px rgba(16,18,24,.08);
    }
    .book-card .cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .book-card .book-title {
      font-size: 12px; line-height: 1.3; margin-top: 6px; height: 32px; overflow: hidden;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    }
    .book-card .pbar { height: 3px; border-radius: 2px; background: rgba(128,128,128,.2); overflow: hidden; margin-top: 4px; }
    .book-card .pbar > i { display: block; height: 100%; background: var(--accent); }
    .book-card:hover .cover { box-shadow: 0 3px 10px rgba(16,18,24,.16); }

    .grid-viewport { flex: 1; overflow-y: auto; position: relative; }
    .grid-sizer { position: relative; width: 100%; }
    .grid-rows { position: absolute; top: 0; left: 0; width: 100%; }
    .grid-row { display: flex; gap: 14px; }
    .grid-cell { flex: none; }
    .grid-cell .book-card { width: 100%; }

    .shelf-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--text-dim); }
  </style>
</head>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="plate">
      <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224"/>
    </clipPath>
  </defs>

  <g clip-path="url(#plate)">
    <rect width="1024" height="1024" fill="#FDF6EC"/>
    <!-- soft warm wash -->
    <circle cx="512" cy="480" r="420" fill="#F8EAD7" opacity="0.7"/>

    <!-- book shadow -->
    <ellipse cx="512" cy="790" rx="310" ry="34" fill="#E8D5BC" opacity="0.9"/>

    <!-- open book covers -->
    <!-- left cover -->
    <path d="M140 520
             C140 505 155 495 180 492
             L470 470
             L470 760
             L180 745
             C155 742 140 730 140 715
             Z"
          fill="#7A9E7E"/>
    <!-- right cover -->
    <path d="M884 520
             C884 505 869 495 844 492
             L554 470
             L554 760
             L844 745
             C869 742 884 730 884 715
             Z"
          fill="#6F9172"/>
    <!-- left page -->
    <path d="M175 515
             L470 492
             L470 735
             L175 722
             Z"
          fill="#F7F1E3"/>
    <!-- right page -->
    <path d="M849 515
             L554 492
             L554 735
             L849 722
             Z"
          fill="#EFE7D4"/>
    <!-- page hint lines -->
    <g stroke="#D2C4A8" stroke-width="8" stroke-linecap="round" opacity="0.8">
      <line x1="220" y1="580" x2="430" y2="570"/>
      <line x1="220" y1="630" x2="410" y2="621"/>
      <line x1="594" y1="570" x2="804" y2="580"/>
      <line x1="594" y1="621" x2="784" y2="630"/>
    </g>

    <!-- cat: American Shorthair silver tabby, front face (round head, full cheeks) -->
    <!-- body -->
    <ellipse cx="512" cy="530" rx="175" ry="125" fill="#C5C9CE"/>
    <!-- classic tabby body swirls -->
    <g fill="none" stroke="#2A2A2E" stroke-width="15" stroke-linecap="round" opacity="0.95">
      <path d="M385 500 Q435 468 485 512"/>
      <path d="M405 560 Q475 528 545 575"/>
      <path d="M545 500 Q605 470 655 520"/>
      <path d="M545 565 Q615 538 660 575"/>
    </g>
    <!-- chest lighter silver -->
    <ellipse cx="512" cy="555" rx="72" ry="58" fill="#E8EAEC" opacity="0.9"/>

    <!-- ears: wide-set, rounded tips (ASH style) -->
    <path d="M380 320 Q360 210 470 275 Q430 300 380 320 Z" fill="#C5C9CE"/>
    <path d="M644 320 Q664 210 554 275 Q594 300 644 320 Z" fill="#B4B9C0"/>
    <path d="M395 305 Q385 235 455 280 Q425 295 395 305 Z" fill="#E8B4B8"/>
    <path d="M629 305 Q639 235 569 280 Q599 295 629 305 Z" fill="#E8B4B8"/>

    <!-- head: wide round face with full cheeks -->
    <ellipse cx="512" cy="405" rx="155" ry="142" fill="#C5C9CE"/>
    <!-- cheek fluff left/right for ASH fullness -->
    <ellipse cx="390" cy="430" rx="55" ry="48" fill="#C5C9CE"/>
    <ellipse cx="634" cy="430" rx="55" ry="48" fill="#B4B9C0"/>

    <!-- forehead M mark -->
    <g fill="none" stroke="#2A2A2E" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
      <path d="M455 318 L485 275 L512 318 L539 275 L569 318"/>
    </g>
    <!-- cheek stripes (classic tabby) -->
    <g fill="none" stroke="#2A2A2E" stroke-width="12" stroke-linecap="round">
      <path d="M370 385 Q345 375 328 370"/>
      <path d="M375 425 Q345 425 325 428"/>
      <path d="M380 465 Q355 472 338 480"/>
      <path d="M654 385 Q679 375 696 370"/>
      <path d="M649 425 Q679 425 699 428"/>
      <path d="M644 465 Q669 472 686 480"/>
    </g>

    <!-- eyes: large almond, green iris (silver tabby ASH) -->
    <ellipse cx="445" cy="405" rx="34" ry="28" fill="#F2EEE6"/>
    <ellipse cx="579" cy="405" rx="34" ry="28" fill="#F2EEE6"/>
    <ellipse cx="448" cy="406" rx="24" ry="22" fill="#5A9E6E"/>
    <ellipse cx="576" cy="406" rx="24" ry="22" fill="#5A9E6E"/>
    <ellipse cx="448" cy="406" rx="11" ry="16" fill="#1A1A1E"/>
    <ellipse cx="576" cy="406" rx="11" ry="16" fill="#1A1A1E"/>
    <circle cx="455" cy="398" r="6" fill="#F2EEE6" opacity="0.95"/>
    <circle cx="583" cy="398" r="6" fill="#F2EEE6" opacity="0.95"/>
    <!-- eyeliner -->
    <g fill="none" stroke="#2A2A2E" stroke-width="5" stroke-linecap="round">
      <path d="M412 398 Q445 372 478 398"/>
      <path d="M546 398 Q579 372 612 398"/>
    </g>

    <!-- muzzle: cream-white, compact (short ASH nose) -->
    <ellipse cx="512" cy="468" rx="48" ry="34" fill="#F2EEE6"/>
    <!-- nose: terracotta brick -->
    <path d="M512 448 L526 462 L498 462 Z" fill="#C45C48"/>
    <!-- mouth -->
    <path d="M512 462 Q512 478 496 484" fill="none" stroke="#3D3D3D" stroke-width="6" stroke-linecap="round"/>
    <path d="M512 462 Q512 478 528 484" fill="none" stroke="#3D3D3D" stroke-width="6" stroke-linecap="round"/>
    <!-- muzzle dots -->
    <g fill="#B4B9C0">
      <circle cx="480" cy="470" r="3"/><circle cx="544" cy="470" r="3"/>
      <circle cx="478" cy="482" r="3"/><circle cx="546" cy="482" r="3"/>
    </g>

    <!-- whiskers -->
    <g stroke="#3D3D3D" stroke-width="4" stroke-linecap="round" opacity="0.7">
      <line x1="455" y1="470" x2="355" y2="455"/>
      <line x1="455" y1="485" x2="360" y2="492"/>
      <line x1="569" y1="470" x2="669" y2="455"/>
      <line x1="569" y1="485" x2="664" y2="492"/>
    </g>

    <!-- front paws on the page -->
    <ellipse cx="420" cy="580" rx="52" ry="36" fill="#C5C9CE"/>
    <ellipse cx="604" cy="580" rx="52" ry="36" fill="#B4B9C0"/>
    <g fill="none" stroke="#2A2A2E" stroke-width="9" stroke-linecap="round" opacity="0.85">
      <path d="M398 568 L408 552"/><path d="M442 568 L432 552"/>
      <path d="M582 568 L592 552"/><path d="M626 568 L616 552"/>
    </g>
    <g fill="#E8B4B8" opacity="0.9">
      <ellipse cx="405" cy="580" rx="9" ry="7"/><ellipse cx="425" cy="573" rx="9" ry="7"/><ellipse cx="445" cy="580" rx="9" ry="7"/>
      <ellipse cx="589" cy="580" rx="9" ry="7"/><ellipse cx="609" cy="573" rx="9" ry="7"/><ellipse cx="629" cy="580" rx="9" ry="7"/>
    </g>

    <!-- Zzz -->
    <g fill="#3D3D3D" opacity="0.7">
      <path d="M680 250 L730 250 L680 300 L730 300" fill="none" stroke="#3D3D3D" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M745 185 L785 185 L745 225 L785 225" fill="none" stroke="#3D3D3D" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M800 135 L830 135 L800 165 L830 165" fill="none" stroke="#3D3D3D" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <rect x="4" y="4" width="1016" height="1016" rx="222" ry="222"
        fill="none" stroke="#E8D5BC" stroke-width="8"/>
</svg>

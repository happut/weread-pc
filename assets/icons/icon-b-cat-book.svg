<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="plate">
      <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224"/>
    </clipPath>
  </defs>

  <g clip-path="url(#plate)">
    <rect width="1024" height="1024" fill="#FDF6EC"/>
    <!-- soft warm wash -->
    <circle cx="512" cy="480" r="420" fill="#F8EAD7" opacity="0.7"/>

    <!-- book shadow -->
    <ellipse cx="512" cy="790" rx="310" ry="34" fill="#E8D5BC" opacity="0.9"/>

    <!-- open book covers -->
    <!-- left cover -->
    <path d="M140 520
             C140 505 155 495 180 492
             L470 470
             L470 760
             L180 745
             C155 742 140 730 140 715
             Z"
          fill="#7A9E7E"/>
    <!-- right cover -->
    <path d="M884 520
             C884 505 869 495 844 492
             L554 470
             L554 760
             L844 745
             C869 742 884 730 884 715
             Z"
          fill="#6F9172"/>
    <!-- left page -->
    <path d="M175 515
             L470 492
             L470 735
             L175 722
             Z"
          fill="#F7F1E3"/>
    <!-- right page -->
    <path d="M849 515
             L554 492
             L554 735
             L849 722
             Z"
          fill="#EFE7D4"/>
    <!-- page hint lines -->
    <g stroke="#D2C4A8" stroke-width="8" stroke-linecap="round" opacity="0.8">
      <line x1="220" y1="580" x2="430" y2="570"/>
      <line x1="220" y1="630" x2="410" y2="621"/>
      <line x1="594" y1="570" x2="804" y2="580"/>
      <line x1="594" y1="621" x2="784" y2="630"/>
    </g>

    <!-- cat body nestled in the book (American Shorthair silver tabby) -->
    <!-- body -->
    <ellipse cx="512" cy="520" rx="175" ry="130" fill="#C5CBD3"/>
    <!-- classic tabby swirls on body -->
    <g fill="none" stroke="#5F6875" stroke-width="16" stroke-linecap="round" opacity="0.9">
      <path d="M390 500 Q430 470 470 505"/>
      <path d="M420 555 Q470 525 520 560"/>
      <path d="M560 500 Q610 475 650 515"/>
      <path d="M530 555 Q590 530 640 570"/>
    </g>
    <!-- head -->
    <circle cx="512" cy="400" r="148" fill="#C5CBD3"/>

    <!-- ears -->
    <path d="M395 310 L370 195 L475 265 Z" fill="#C5CBD3"/>
    <path d="M629 310 L654 195 L549 265 Z" fill="#B8BFC8"/>
    <path d="M405 295 L390 225 L455 268 Z" fill="#E8B4B8"/>
    <path d="M619 295 L634 225 L569 268 Z" fill="#E8B4B8"/>
    <!-- ear tip darkening (silver tabby) -->
    <path d="M370 195 L400 230 L475 265 L395 310 Z" fill="#8A929E" opacity="0.35"/>
    <path d="M654 195 L624 230 L549 265 L629 310 Z" fill="#8A929E" opacity="0.35"/>

    <!-- forehead M mark + cheek stripes (classic tabby) -->
    <g fill="none" stroke="#5F6875" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
      <!-- M -->
      <path d="M455 320 L480 275 L512 315 L544 275 L569 320"/>
      <!-- outer eye stripes -->
      <path d="M385 375 Q360 355 345 345"/>
      <path d="M395 415 Q365 405 348 400"/>
      <path d="M639 375 Q664 355 679 345"/>
      <path d="M629 415 Q659 405 676 400"/>
    </g>

    <!-- closed eyes (content) -->
    <path d="M430 400 Q455 385 480 400" fill="none" stroke="#3D3D3D" stroke-width="12" stroke-linecap="round"/>
    <path d="M544 400 Q569 385 594 400" fill="none" stroke="#3D3D3D" stroke-width="12" stroke-linecap="round"/>

    <!-- muzzle (lighter silver) -->
    <ellipse cx="512" cy="455" rx="50" ry="36" fill="#E6EAEE"/>
    <!-- nose (brick red, silver tabby) -->
    <path d="M512 432 L528 448 L496 448 Z" fill="#C45C48"/>
    <!-- mouth -->
    <path d="M512 448 Q512 465 495 472" fill="none" stroke="#3D3D3D" stroke-width="7" stroke-linecap="round"/>
    <path d="M512 448 Q512 465 529 472" fill="none" stroke="#3D3D3D" stroke-width="7" stroke-linecap="round"/>

    <!-- whiskers -->
    <g stroke="#3D3D3D" stroke-width="5" stroke-linecap="round" opacity="0.75">
      <line x1="430" y1="450" x2="340" y2="435"/>
      <line x1="430" y1="468" x2="345" y2="475"/>
      <line x1="594" y1="450" x2="684" y2="435"/>
      <line x1="594" y1="468" x2="679" y2="475"/>
    </g>

    <!-- front paws over the page edge -->
    <ellipse cx="420" cy="575" rx="52" ry="36" fill="#C5CBD3"/>
    <ellipse cx="604" cy="575" rx="52" ry="36" fill="#B8BFC8"/>
    <!-- paw stripes + toe beans hint -->
    <g fill="none" stroke="#5F6875" stroke-width="10" stroke-linecap="round" opacity="0.85">
      <path d="M395 560 L405 545"/>
      <path d="M445 560 L435 545"/>
      <path d="M579 560 L589 545"/>
      <path d="M629 560 L619 545"/>
    </g>
    <g fill="#E8B4B8" opacity="0.9">
      <ellipse cx="405" cy="575" rx="10" ry="8"/>
      <ellipse cx="425" cy="568" rx="10" ry="8"/>
      <ellipse cx="445" cy="575" rx="10" ry="8"/>
      <ellipse cx="589" cy="575" rx="10" ry="8"/>
      <ellipse cx="609" cy="568" rx="10" ry="8"/>
      <ellipse cx="629" cy="575" rx="10" ry="8"/>
    </g>

    <!-- Zzz -->
    <g fill="#3D3D3D" opacity="0.7">
      <path d="M680 250 L730 250 L680 300 L730 300" fill="none" stroke="#3D3D3D" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M745 185 L785 185 L745 225 L785 225" fill="none" stroke="#3D3D3D" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M800 135 L830 135 L800 165 L830 165" fill="none" stroke="#3D3D3D" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <rect x="4" y="4" width="1016" height="1016" rx="222" ry="222"
        fill="none" stroke="#E8D5BC" stroke-width="8"/>
</svg>

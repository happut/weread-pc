<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="plate">
      <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224"/>
    </clipPath>
    <linearGradient id="pageL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBF7EE"/>
      <stop offset="100%" stop-color="#EDE4D3"/>
    </linearGradient>
    <linearGradient id="pageR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7F1E3"/>
      <stop offset="100%" stop-color="#E2D6C0"/>
    </linearGradient>
  </defs>

  <!-- plate -->
  <g clip-path="url(#plate)">
    <rect width="1024" height="1024" fill="#2B3A67"/>
    <!-- subtle inner vignette -->
    <circle cx="512" cy="512" r="520" fill="#243258" opacity="0.35"/>

    <!-- book soft shadow -->
    <ellipse cx="512" cy="780" rx="300" ry="36" fill="#1A2544" opacity="0.45"/>

    <!-- open book: left page -->
    <path d="M170 330
             C220 300 300 290 360 300
             L500 340
             L500 720
             L360 700
             C300 692 220 700 170 730
             Z"
          fill="url(#pageL)"/>
    <!-- open book: right page -->
    <path d="M854 330
             C804 300 724 290 664 300
             L524 340
             L524 720
             L664 700
             C724 692 804 700 854 730
             Z"
          fill="url(#pageR)"/>

    <!-- spine -->
    <path d="M500 340 L524 340 L524 720 L500 720 Z" fill="#C9BBA0"/>
    <path d="M512 342 L512 718" stroke="#B3A288" stroke-width="4" stroke-linecap="round"/>

    <!-- text lines left (abstract) -->
    <g stroke="#C4B49A" stroke-width="10" stroke-linecap="round" opacity="0.7">
      <line x1="230" y1="400" x2="450" y2="425"/>
      <line x1="230" y1="460" x2="450" y2="485"/>
      <line x1="230" y1="520" x2="430" y2="543"/>
      <line x1="230" y1="580" x2="450" y2="603"/>
      <line x1="230" y1="640" x2="400" y2="660"/>
    </g>

    <!-- text lines right (shorter, room for the fold) -->
    <g stroke="#C4B49A" stroke-width="10" stroke-linecap="round" opacity="0.7">
      <line x1="574" y1="425" x2="720" y2="408"/>
      <line x1="574" y1="485" x2="700" y2="470"/>
    </g>

    <!-- folded page corner turning into a mouse cursor -->
    <!-- the dog-ear fold -->
    <path d="M854 330
             L854 520
             L684 360
             Z"
          fill="#E8A54B"/>
    <path d="M854 520
             L684 360
             L720 330
             Z"
          fill="#F0B85E"/>

    <!-- mouse cursor arrow sitting on the fold, amber -->
    <path d="M690 355
             L690 530
             L735 488
             L762 552
             L800 536
             L772 474
             L830 466
             Z"
          fill="#E8A54B"
          stroke="#2B3A67"
          stroke-width="10"
          stroke-linejoin="round"/>
    <path d="M690 355
             L690 530
             L735 488
             L762 552
             L800 536
             L772 474
             L830 466
             Z"
          fill="none"
          stroke="#F6C97A"
          stroke-width="4"
          stroke-linejoin="round"
          opacity="0.5"/>

    <!-- bookmark ribbon -->
    <path d="M470 720 L470 830 L512 800 L554 830 L554 720 Z" fill="#C45C48"/>
    <path d="M512 722 L512 800" stroke="#A34736" stroke-width="6"/>
  </g>

  <!-- plate edge -->
  <rect x="4" y="4" width="1016" height="1016" rx="222" ry="222"
        fill="none" stroke="#1F2B4D" stroke-width="8" opacity="0.5"/>
</svg>

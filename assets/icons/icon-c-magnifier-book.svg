<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="plate">
      <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224"/>
    </clipPath>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4B07A"/>
      <stop offset="55%" stop-color="#B08D57"/>
      <stop offset="100%" stop-color="#8A6C3E"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7F4EC" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#D9E2DC" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="1.2" fill="#D9C9A8" opacity="0.35"/>
      <circle cx="18" cy="16" r="1" fill="#D9C9A8" opacity="0.28"/>
    </pattern>
    <clipPath id="lensClip">
      <circle cx="620" cy="520" r="122"/>
    </clipPath>
  </defs>

  <g clip-path="url(#plate)">
    <!-- parchment field -->
    <rect width="1024" height="1024" fill="#EFE6D5"/>
    <rect width="1024" height="1024" fill="url(#paper)"/>

    <!-- soft edge shade -->
    <circle cx="512" cy="512" r="520" fill="#E2D4B8" opacity="0.25"/>

    <!-- book shadow -->
    <ellipse cx="520" cy="800" rx="300" ry="30" fill="#C4B08C" opacity="0.55"/>

    <!-- open book (bottle green cloth) -->
    <!-- left cover -->
    <path d="M175 360
             C215 335 300 325 360 335
             L510 375
             L510 760
             L360 740
             C300 732 215 740 175 765
             Z"
          fill="#2F4F4F"/>
    <!-- right cover -->
    <path d="M865 360
             C825 335 740 325 680 335
             L530 375
             L530 760
             L680 740
             C740 732 825 740 865 765
             Z"
          fill="#274545"/>
    <!-- left page -->
    <path d="M210 385
             C245 365 315 358 365 368
             L505 405
             L505 720
             L365 705
             C315 698 245 705 210 725
             Z"
          fill="#F3EAD7"/>
    <!-- right page -->
    <path d="M830 385
             C795 365 725 358 675 368
             L535 405
             L535 720
             L675 705
             C725 698 795 705 830 725
             Z"
          fill="#E9DCC3"/>
    <!-- spine -->
    <path d="M505 405 L535 405 L535 720 L505 720 Z" fill="#1E3838"/>
    <path d="M520 408 L520 718" stroke="#2F4F4F" stroke-width="5"/>

    <!-- abstract ink text lines -->
    <g stroke="#B9A886" stroke-width="9" stroke-linecap="round" opacity="0.75">
      <line x1="255" y1="455" x2="470" y2="478"/>
      <line x1="255" y1="510" x2="470" y2="533"/>
      <line x1="255" y1="565" x2="445" y2="586"/>
      <line x1="255" y1="620" x2="470" y2="641"/>
      <line x1="575" y1="478" x2="790" y2="455"/>
      <line x1="575" y1="533" x2="770" y2="512"/>
    </g>

    <!-- red silk ribbon -->
    <path d="M470 720
             C455 780 445 830 430 880
             L475 855
             L500 900
             L530 845
             L560 880
             L555 720
             Z"
          fill="#C45C48"/>
    <path d="M512 722 C500 780 495 820 485 860" fill="none" stroke="#A34736" stroke-width="6" opacity="0.8"/>

    <!-- magnifying glass, diagonal: lens upper-left, handle lower-right -->
    <!-- handle (drawn under the lens ring) -->
    <g transform="rotate(38 700 620)">
      <rect x="720" y="595" width="180" height="42" rx="21" fill="url(#brass)"/>
      <rect x="730" y="604" width="160" height="11" rx="6" fill="#E0C48E" opacity="0.45"/>
      <rect x="880" y="590" width="36" height="52" rx="14" fill="#8A6C3E"/>
    </g>

    <!-- lens outer ring -->
    <circle cx="620" cy="520" r="155" fill="url(#brass)"/>
    <circle cx="620" cy="520" r="155" fill="none" stroke="#7A5C36" stroke-width="6"/>
    <!-- glass -->
    <circle cx="620" cy="520" r="122" fill="url(#glass)"/>

    <!-- magnified abstract ink strokes drawn ON the glass (what the lens reveals) -->
    <g clip-path="url(#lensClip)">
      <g stroke="#5C4A32" stroke-width="16" stroke-linecap="round" opacity="0.85">
        <line x1="545" y1="500" x2="695" y2="485"/>
        <line x1="540" y1="545" x2="690" y2="531"/>
        <line x1="555" y1="590" x2="670" y2="578"/>
      </g>
      <!-- tiny magnified ink flecks -->
      <g fill="#5C4A32" opacity="0.7">
        <circle cx="560" cy="460" r="5"/>
        <circle cx="680" cy="615" r="4"/>
      </g>
    </g>

    <!-- glass highlight -->
    <path d="M540 450 Q580 415 635 410" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" opacity="0.55"/>
    <path d="M545 475 Q565 455 590 445" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.35"/>
    <!-- ring inner shade -->
    <circle cx="620" cy="520" r="122" fill="none" stroke="#5C4A32" stroke-width="8" opacity="0.35"/>
  </g>

  <rect x="4" y="4" width="1016" height="1016" rx="222" ry="222"
        fill="none" stroke="#D9C9A8" stroke-width="8"/>
</svg>
